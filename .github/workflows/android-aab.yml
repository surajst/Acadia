name: Android AAB (Google Play)

# Builds the signed Android App Bundle that Google Play requires (Play does not
# accept APKs for new apps). Same pipeline as android-apk.yml -- same keystore,
# same config plugins -- but `bundleRelease` instead of `assembleRelease`, and
# the bundle is kept as a workflow artifact rather than a public release: it is
# for uploading to Play Console, not for sideloading.
#
# The keystore in ANDROID_KEYSTORE_BASE64 becomes the Play *upload* key; Play
# App Signing holds the key that signs what users install.
#
# Manual only. This repository is public, so no pull_request trigger.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Build signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - run: npm ci

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set. Refusing to build a debug-signed bundle." >&2
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$HOME/release.jks"

      - name: Prebuild native project
        env:
          EXPO_PUBLIC_API_HOST: ${{ vars.EXPO_PUBLIC_API_HOST || 'https://acadia-backend-sg.onrender.com' }}
        run: npx expo prebuild -p android --no-install

      - name: Confirm signing and memory config applied
        run: |
          grep -q "ACADIA_STORE_FILE" android/app/build.gradle || { echo "withReleaseSigning did not apply" >&2; exit 1; }
          grep -q "MaxMetaspaceSize=2048m" android/gradle.properties || { echo "withGradleMemory did not apply" >&2; exit 1; }

      - name: Build release bundle
        env:
          EXPO_PUBLIC_API_HOST: ${{ vars.EXPO_PUBLIC_API_HOST || 'https://acadia-backend-sg.onrender.com' }}
        working-directory: mobile-app/android
        run: |
          ./gradlew bundleRelease --no-daemon \
            -PACADIA_STORE_FILE="$HOME/release.jks" \
            -PACADIA_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PACADIA_STORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PACADIA_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"

      # Play rejects or flags these at upload time; catch them here instead.
      - name: Check the bundle against Play requirements
        run: |
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -1)
          echo "inspecting $AAB"
          curl -sSL -o /tmp/bundletool.jar https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          java -jar /tmp/bundletool.jar dump manifest --bundle "$AAB" > /tmp/manifest.xml
          TARGET=$(grep -o 'android:targetSdkVersion="[0-9]*"' /tmp/manifest.xml | grep -o '[0-9]*')
          echo "targetSdkVersion=$TARGET"
          if [ -z "$TARGET" ] || [ "$TARGET" -lt 36 ]; then
            echo "Google Play requires targetSdkVersion 36 or higher for new apps." >&2
            exit 1
          fi
          for P in ACCESS_BACKGROUND_LOCATION FOREGROUND_SERVICE_LOCATION; do
            if grep -q "android.permission.$P" /tmp/manifest.xml; then
              echo "$P is in the manifest -- v1 ships without background location." >&2
              exit 1
            fi
          done
          grep -o 'android.permission\.[A-Z_]*' /tmp/manifest.xml | sort -u
          unzip -o -q "$AAB" "base/assets/index.android.bundle" -d /tmp/aabcheck
          if grep -qa "localhost:1[0-9]\{4\}" /tmp/aabcheck/base/assets/index.android.bundle; then
            echo "Bundle contains a localhost API host." >&2
            exit 1
          fi
          grep -qa "acadia-backend-sg.onrender.com" /tmp/aabcheck/base/assets/index.android.bundle \
            || { echo "Bundle does not reference the production backend." >&2; exit 1; }
          ls -lh "$AAB"

      - uses: actions/upload-artifact@v4
        with:
          name: acadia-aab
          path: mobile-app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
