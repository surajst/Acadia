name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Dedicated fast job so the ADR 0001 layering gate is its own required status
  # check. GitHub reports checks per JOB, not per step — a required check named
  # "Enforce architecture" only exists if ArchUnit runs as its own job like this.
  enforce-architecture:
    name: Enforce architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: ArchUnit layering gate (ADR 0001)
        working-directory: backend
        run: mvn -B test -Dtest=LayeringArchitectureTest

  # Every migration in this repo is written twice, once for H2 and once for
  # Postgres, and until now only the H2 copy was ever executed -- tests run on H2.
  # Production is Postgres, so a Postgres-only syntax error is invisible until
  # deploy, where Flyway fails and the application does not start.
  #
  # V21 is the case in point: its Postgres form uses a DO block, a CTE feeding
  # UPDATE ... FROM, and GET DIAGNOSTICS, none of which H2 has. Its H2 twin is a
  # completely different statement, so testing one says nothing about the other.
  #
  # This runs the shipped Postgres file against a real Postgres 18 and checks the
  # outcome, not just that it parses. The migration plan asks for a Postgres
  # migration check in CI as part of its Phase 2; this is the start of it. The
  # honest limitation: it builds a minimal schema rather than applying the whole
  # V1..V21 chain, so it proves V21 and not its predecessors.
  postgres-migrations:
    name: Postgres migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: migrationtest
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: ci-throwaway
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: migrationtest
    steps:
      - uses: actions/checkout@v4

      - name: Build the minimum schema V21 touches
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE academic_years (
            id uuid PRIMARY KEY,
            start_date date NOT NULL
          );
          CREATE TABLE students (
            id uuid PRIMARY KEY,
            academic_year_id uuid NOT NULL REFERENCES academic_years(id),
            first_name varchar(255),
            admission_date date
          );
          CREATE TABLE audit_logs (
            id uuid PRIMARY KEY,
            entity_type varchar(255),
            entity_id uuid,
            action varchar(255) NOT NULL,
            created_at timestamp(6) NOT NULL
          );
          SQL

      - name: Seed the cases the migration has to distinguish
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO academic_years VALUES
            ('11111111-1111-1111-1111-111111111111', '2026-06-01');

          -- riya: no admission date, and her only trace is a fee schedule --
          -- which is exactly why V18's STUDENT_ADDED-only backfill skipped her.
          INSERT INTO students VALUES
            ('aaaaaaaa-0000-0000-0000-000000000001',
             '11111111-1111-1111-1111-111111111111', 'riya', NULL);
          -- yearstart: admission date already equals the year start (the
          -- finding's own hypothesis).
          INSERT INTO students VALUES
            ('aaaaaaaa-0000-0000-0000-000000000002',
             '11111111-1111-1111-1111-111111111111', 'yearstart', '2026-06-01');
          -- stated: a date a person chose. Must not be touched.
          INSERT INTO students VALUES
            ('aaaaaaaa-0000-0000-0000-000000000003',
             '11111111-1111-1111-1111-111111111111', 'stated', '2026-07-15');
          -- notrace: nothing is known about when this one joined.
          INSERT INTO students VALUES
            ('aaaaaaaa-0000-0000-0000-000000000004',
             '11111111-1111-1111-1111-111111111111', 'notrace', NULL);
          -- backwards: its only trace predates the year, so using it would move
          -- the date earlier and bill the family sooner.
          INSERT INTO students VALUES
            ('aaaaaaaa-0000-0000-0000-000000000005',
             '11111111-1111-1111-1111-111111111111', 'backwards', NULL);

          INSERT INTO audit_logs VALUES
            ('bbbbbbbb-0000-0000-0000-000000000001', 'Student',
             'aaaaaaaa-0000-0000-0000-000000000001', 'FEE_SCHEDULE_GENERATED',
             '2026-09-23 09:30:00'),
            -- a later trace for the same student: the earliest must win
            ('bbbbbbbb-0000-0000-0000-000000000002', 'Student',
             'aaaaaaaa-0000-0000-0000-000000000001', 'XP_AWARDED',
             '2026-12-04 09:30:00'),
            ('bbbbbbbb-0000-0000-0000-000000000003', 'Student',
             'aaaaaaaa-0000-0000-0000-000000000002', 'STUDENT_UPDATED',
             '2026-09-23 09:30:00'),
            ('bbbbbbbb-0000-0000-0000-000000000004', 'Student',
             'aaaaaaaa-0000-0000-0000-000000000003', 'STUDENT_UPDATED',
             '2026-11-02 09:30:00'),
            ('bbbbbbbb-0000-0000-0000-000000000005', 'Student',
             'aaaaaaaa-0000-0000-0000-000000000005', 'ROSTER_BULK_IMPORT',
             '2026-03-01 09:30:00'),
            -- a row carrying riya's id but about an invoice: entity_type has to
            -- be part of the match, not just the id
            ('bbbbbbbb-0000-0000-0000-000000000006', 'FeeInvoice',
             'aaaaaaaa-0000-0000-0000-000000000004', 'FEE_INVOICE_CANCELLED',
             '2026-08-01 09:30:00');
          SQL

      - name: Run the shipped Postgres migration
        run: |
          # The file as it will run in production, including its DO block. A
          # syntax error here is a deploy that fails to start.
          psql -v ON_ERROR_STOP=1 \
            -f backend/src/main/resources/db/migration/postgresql/V21__admission_date_from_first_trace.sql

      - name: Assert each case came out right
        run: |
          check() {
            actual=$(psql -tAc "SELECT COALESCE(CAST(admission_date AS text), 'NULL') FROM students WHERE first_name = '$1'")
            if [ "$actual" != "$2" ]; then
              echo "FAIL $1: expected $2, got $actual" >&2
              exit 1
            fi
            echo "ok   $1 = $actual"
          }
          # Filled from her earliest student-scoped trace, not her latest.
          check riya      2026-09-23
          # The year start counts as a gap, so it is corrected too.
          check yearstart 2026-09-23
          # A date a person set is an answer, not a gap.
          check stated    2026-07-15
          # No evidence means no invented date.
          check notrace   NULL
          # Never move the date backwards.
          check backwards NULL

      - name: Assert it is idempotent
        run: |
          before=$(psql -tAc "SELECT string_agg(first_name || '=' || COALESCE(CAST(admission_date AS text),'NULL'), ',' ORDER BY first_name) FROM students")
          psql -v ON_ERROR_STOP=1 \
            -f backend/src/main/resources/db/migration/postgresql/V21__admission_date_from_first_trace.sql
          after=$(psql -tAc "SELECT string_agg(first_name || '=' || COALESCE(CAST(admission_date AS text),'NULL'), ',' ORDER BY first_name) FROM students")
          echo "before: $before"
          echo "after:  $after"
          test "$before" = "$after"

      - name: Assert both vendors ship the same migration versions
        run: |
          # A version present for one vendor and missing for the other is a
          # schema that drifts, and Flyway refusing to start on whichever is
          # behind. Cheap to check, and it has to hold for every version, not
          # just the newest.
          h2=$(ls backend/src/main/resources/db/migration/h2/ | sed 's/__.*//' | sort)
          pg=$(ls backend/src/main/resources/db/migration/postgresql/ | sed 's/__.*//' | sort)
          if [ "$h2" != "$pg" ]; then
            echo "migration versions differ between vendors:" >&2
            diff <(echo "$h2") <(echo "$pg") || true
            exit 1
          fi
          echo "both vendors ship: $(echo $h2 | tr '\n' ' ')"

  # The backup job, exercised end to end against a throwaway Postgres and a fake
  # S3. Nothing here touches the real bucket -- the production credentials are
  # not available to CI and the uploads go to MinIO on localhost.
  #
  # The point is not that pg_dump works. It is that the two sanity checks fire:
  # a dump can succeed and still be useless (taken against an empty database, or
  # by a role that cannot see the schema), and that is the failure that looks
  # like success for months and is discovered during a restore. So this asserts
  # the guard *rejects* a thin dump as well as accepting a good one.
  database-backup:
    name: Database backup job
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same major version as the image and as production Neon. A mismatch is
        # exactly what the Dockerfile's comment warns about, so CI should not be
        # the place it silently differs.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: backuptest
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Seed enough tables to satisfy the guard
        env:
          PGPASSWORD: ci-throwaway
        run: |
          # 22 tables with a row each, so MIN_TABLES=20 passes with margin rather
          # than landing exactly on the floor.
          for i in $(seq 1 22); do
            psql -h localhost -U postgres -d backuptest \
              -c "CREATE TABLE t$i (id int primary key, payload text);" \
              -c "INSERT INTO t$i VALUES ($i, repeat('x', 800));"
          done

      - name: Build the backup image
        run: docker build -t acadia-backup ./backup

      - name: Install a recording stand-in for the aws CLI
        # No MinIO, and no third-party registry at all.
        #
        # Two attempts went out over a fake S3 and both died on the pull:
        # `docker pull minio/minio` answers "pull access denied ... may require
        # 'docker login'" for an anonymous puller, and moving to quay.io did not
        # fix it either. A CI job for a backup script should not be able to fail
        # because somebody else's registry changed its access policy.
        #
        # So the aws binary inside the image is replaced with a script that
        # records its arguments. What this proves: pg_dump runs against a real
        # Postgres 18, both sanity checks fire, the upload is invoked exactly
        # once per destination with the right key and flags, the Sunday branch
        # behaves, and no credential reaches the log.
        #
        # What it deliberately does NOT prove: that bytes land in a real bucket.
        # Nothing here can prove that -- in production the uploader may only
        # PutObject, so it cannot read back what it wrote either. That is
        # verified by a human running backup/RESTORE.md, which is the only check
        # that ever actually mattered.
        run: |
          mkdir -p ci-aws
          # printf rather than a heredoc, but not for the reason first claimed
          # here: a YAML block scalar strips the block's own indentation before
          # the shell sees it, so an indented heredoc terminator does land at
          # column 0 and works fine (the seeding steps below rely on exactly
          # that). printf just keeps a two-line file on two lines.
          printf '%s\n' \
            '#!/bin/sh' \
            'echo "AWS-CALL $*" >> /ci-aws/calls.log' \
            > ci-aws/aws
          chmod 755 ci-aws/aws
          cat ci-aws/aws
          # World-writable because the container runs as its own user (postgres)
          # and appends to this file through the bind mount.
          : > ci-aws/calls.log
          chmod 666 ci-aws/calls.log

      - name: Run the backup and assert it reports BACKUP OK
        run: |
          set -o pipefail
          # --network host so the container reaches the Postgres service on the
          # runner's localhost. The bind mount lands on /usr/bin/aws, which is
          # where apk put the real one.
          docker run --rm --network host \
            -v "$PWD/ci-aws/aws:/usr/bin/aws:ro" \
            -v "$PWD/ci-aws:/ci-aws" \
            -e BACKUP_DATABASE_URL="postgresql://postgres:ci-throwaway@localhost:5432/backuptest?sslmode=disable" \
            -e BACKUP_BUCKET=ci-backup-bucket \
            -e MIN_TABLES=20 \
            acadia-backup | tee backup.log

          # The line a human greps for, so its exact shape is part of the
          # contract: file, bytes, table count, nothing else.
          grep -E "^BACKUP OK acadia-[0-9T-]+Z\.dump [0-9]+ [0-9]+$" backup.log
          test "$(grep -c '^BACKUP OK' backup.log)" = "1"

          # The table count has to be the real one, not a placeholder -- 22
          # tables were seeded above.
          test "$(awk '/^BACKUP OK/ {print $5}' backup.log)" = "22"

          # Nothing may leak the connection string into a log that is retained
          # and readable from the Render dashboard.
          if grep -q "ci-throwaway" backup.log; then
            echo "the database password reached the log" >&2
            exit 1
          fi

      - name: Assert the upload was invoked correctly
        run: |
          cat ci-aws/calls.log
          # Exactly one upload on a weekday, to daily/, encrypted, quiet.
          grep -E "^AWS-CALL s3 cp /tmp/acadia-[0-9T-]+Z\.dump s3://ci-backup-bucket/daily/acadia-[0-9T-]+Z\.dump --sse AES256 --only-show-errors$" ci-aws/calls.log

          # And the file it uploaded is the file it dumped -- same name in both,
          # which a copy/paste error in the script would break silently.
          dumped=$(awk '/^BACKUP OK/ {print $3}' backup.log)
          grep -q "daily/$dumped" ci-aws/calls.log

      - name: Assert the endpoint override reaches the aws call
        run: |
          : > ci-aws/calls.log
          docker run --rm --network host \
            -v "$PWD/ci-aws/aws:/usr/bin/aws:ro" \
            -v "$PWD/ci-aws:/ci-aws" \
            -e BACKUP_DATABASE_URL="postgresql://postgres:ci-throwaway@localhost:5432/backuptest?sslmode=disable" \
            -e BACKUP_BUCKET=ci-backup-bucket \
            -e BACKUP_S3_ENDPOINT=http://example.invalid:9000 \
            -e MIN_TABLES=20 \
            acadia-backup >/dev/null
          # The seam exists so a real S3 can be substituted; if it silently
          # stopped being passed through, a local test would quietly hit the
          # real endpoint instead.
          grep -q -- "--endpoint-url http://example.invalid:9000" ci-aws/calls.log

      - name: Assert a dump too thin to be real is rejected
        run: |
          # The check that matters most. MIN_TABLES above what the database holds
          # stands in for a dump taken against an empty database, or by a role
          # that cannot see the schema -- which pg_dump reports as success.
          : > ci-aws/calls.log
          if docker run --rm --network host \
            -v "$PWD/ci-aws/aws:/usr/bin/aws:ro" \
            -v "$PWD/ci-aws:/ci-aws" \
            -e BACKUP_DATABASE_URL="postgresql://postgres:ci-throwaway@localhost:5432/backuptest?sslmode=disable" \
            -e BACKUP_BUCKET=ci-backup-bucket \
            -e MIN_TABLES=500 \
            acadia-backup > thin.log 2>&1; then
            echo "a dump holding 22 tables was accepted against a floor of 500" >&2
            cat thin.log
            exit 1
          fi
          grep "BACKUP FAILED" thin.log
          # And it refused *before* uploading. A guard that rejects the dump
          # after putting it in the bucket has not protected anything.
          test ! -s ci-aws/calls.log

      - name: Assert a missing variable fails fast rather than uploading nothing
        run: |
          : > ci-aws/calls.log
          if docker run --rm --network host \
            -v "$PWD/ci-aws/aws:/usr/bin/aws:ro" \
            -v "$PWD/ci-aws:/ci-aws" \
            -e BACKUP_BUCKET=ci-backup-bucket \
            acadia-backup > unset.log 2>&1; then
            echo "the job ran with no database URL" >&2
            exit 1
          fi
          grep "BACKUP_DATABASE_URL" unset.log
          test ! -s ci-aws/calls.log

  # Until now nothing in CI looked at mobile-app at all — no typecheck, no lint,
  # no contrast check — which is why a token codemod that put dark *background*
  # values onto *ink* tokens shipped: attendance cells at 1.45:1, and one badge
  # with the same token for text and background. It runs independently of the
  # backend jobs so app-only PRs get an answer in under a minute.
  mobile-app:
    name: mobile-app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Contrast gate
        run: npm run check:contrast

      # Errors block. The 22 remaining warnings are capped by --max-warnings so
      # the backlog cannot quietly grow back; lower that number as they go, and
      # never raise it.
      - name: Lint
        run: npm run lint

  build-and-test:
    name: build-and-test
    needs: enforce-architecture
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend unit tests
        working-directory: backend
        run: mvn -B test

      - name: Build backend jar
        working-directory: backend
        run: mvn -B clean package -DskipTests

      - name: Launch backend
        working-directory: backend
        run: |
          nohup java -jar target/backend-0.0.1-SNAPSHOT.jar --app.dev-mode=true > backend.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/login || true)
            if [ "$code" = "200" ]; then echo "Backend is up"; exit 0; fi
            sleep 2
          done
          echo "Backend failed to start in time"
          cat backend.log
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright and dependencies
        working-directory: backend/src/test/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright e2e suite
        working-directory: backend/src/test/e2e
        run: npx playwright test --config=playwright.web.config.js

      # The mobile suite runs here rather than in its own job so it can reuse the
      # backend already booted above -- a second job would have to rebuild and
      # relaunch it, which costs far more than the two minutes this adds. It had
      # never run anywhere: 7 of its 10 tests were failing against the redesigned
      # app and nothing said so.
      - name: Install mobile-app dependencies
        working-directory: mobile-app
        run: npm ci

      # Port 8081 is not arbitrary: it is the only localhost origin the backend's
      # CORS list allows.
      - name: Launch Expo web
        working-directory: mobile-app
        env:
          EXPO_PUBLIC_API_HOST: http://localhost:8080
        run: |
          nohup npx expo start --web --port 8081 > expo.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/ || true)
            if [ "$code" = "200" ]; then echo "Expo web is up"; exit 0; fi
            sleep 5
          done
          echo "Expo web failed to start in time"
          cat expo.log
          exit 1

      - name: Run mobile Playwright suite
        working-directory: backend/src/test/e2e
        run: npx playwright test --config=playwright.mobile.config.js

      - name: Dump Expo log on failure
        if: failure()
        run: cat mobile-app/expo.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: backend/src/test/e2e/playwright-report/
          retention-days: 14

      - name: Dump backend log on failure
        if: failure()
        run: cat backend/backend.log || true
