name: Android APK

# Builds a signed release APK with Gradle and publishes it as a GitHub Release
# asset, so the download link is a public URL on this repository rather than an
# expo.dev artifact URL and nothing in the pipeline depends on Expo's build
# service. The app still uses Expo's libraries -- this replaces EAS Build, not
# Expo itself.
#
# Deliberately NOT triggered by pull_request. This repository is public, so a
# pull_request trigger would let a fork's workflow run against the signing key.
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: What changed in this build
        required: false
        default: Manual build
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    # A Gradle build that exhausts metaspace does not fail -- it thrashes. The
    # first run of this workflow sat for four and a half hours doing nothing and
    # was killed by GitHub's six-hour job ceiling. Fail in one hour instead.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile-app

    steps:
      - uses: actions/checkout@v4

      # Gradle 9.3.1, which the Expo template pins, needs JDK 17+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - run: npm ci

      # The keystore is stored base64-encoded because a secret is text. Written
      # outside the workspace so it can never be picked up by the build archive
      # or left behind in an artifact.
      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set. Refusing to build:" \
                 "without it Gradle silently falls back to the public debug key." >&2
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$HOME/release.jks"
          echo "keystore restored ($(stat -c%s "$HOME/release.jks") bytes)"

      # Generates android/ from app.json. The withReleaseSigning config plugin
      # runs here -- that is what puts the real signingConfig into the generated
      # build.gradle, which otherwise signs release with the debug key.
      - name: Prebuild native project
        env:
          EXPO_PUBLIC_API_HOST: ${{ vars.EXPO_PUBLIC_API_HOST || 'https://acadia-backend-sg.onrender.com' }}
        run: npx expo prebuild -p android --no-install

      - name: Confirm the config plugins actually applied
        run: |
          if ! grep -q "ACADIA_STORE_FILE" android/app/build.gradle; then
            echo "withReleaseSigning did not apply -- this build would be debug-signed." >&2
            exit 1
          fi
          # android/ is regenerated by prebuild, so a memory fix that lives only
          # in the generated file silently does not reach CI. That is what caused
          # the first run to hang. Assert it landed rather than assume.
          if ! grep -q "MaxMetaspaceSize=2048m" android/gradle.properties; then
            echo "withGradleMemory did not apply -- the build would thrash on metaspace." >&2
            grep jvmargs android/gradle.properties >&2 || true
            exit 1
          fi
          echo "signing + memory config present"
          grep -E "jvmargs" android/gradle.properties

      - name: Build release APKs
        env:
          EXPO_PUBLIC_API_HOST: ${{ vars.EXPO_PUBLIC_API_HOST || 'https://acadia-backend-sg.onrender.com' }}
        working-directory: mobile-app/android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PACADIA_STORE_FILE="$HOME/release.jks" \
            -PACADIA_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PACADIA_STORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PACADIA_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"

      # The local .env pins EXPO_PUBLIC_API_HOST to a localhost port. It is
      # gitignored so it should never reach a runner, but "should" is not a
      # check: a build that quietly shipped localhost would look identical to a
      # good one until someone installed it. Assert on the artifact itself.
      - name: Verify the APK points at production
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*universal*.apk \
                   android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          echo "inspecting $APK"
          unzip -o -q "$APK" "assets/index.android.bundle" -d /tmp/apkcheck
          B=/tmp/apkcheck/assets/index.android.bundle
          if grep -qa "localhost:1[0-9]\{4\}" "$B"; then
            echo "APK contains a localhost API host -- refusing to publish it." >&2
            exit 1
          fi
          if ! grep -qa "acadia-backend-sg.onrender.com" "$B"; then
            echo "APK does not reference the production backend." >&2
            exit 1
          fi
          echo "API host verified"

      - name: Report sizes
        run: ls -lh android/app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: acadia-apk
          path: mobile-app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Release assets on a public repository are downloadable without a GitHub
      # account, which workflow artifacts are not.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            TAG="build-${GITHUB_RUN_NUMBER}"
          fi
          gh release create "$TAG" \
            android/app/build/outputs/apk/release/*.apk \
            --title "Acadia Android $TAG" \
            --notes "${{ github.event.inputs.release_notes || 'Tagged release' }}
          Commit: ${{ github.sha }}" \
            --repo "${{ github.repository }}" \
          || gh release upload "$TAG" \
            android/app/build/outputs/apk/release/*.apk --clobber \
            --repo "${{ github.repository }}"
          echo "Download URLs:"
          gh release view "$TAG" --repo "${{ github.repository }}" \
            --json assets -q '.assets[].url'
