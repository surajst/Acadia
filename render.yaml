# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in the Render dashboard choose
# "New > Blueprint" and point it at this repo. Render reads this file and
# provisions both services below in one step.
#
# After the first deploy, go to Web Service > Environment and set
# DEMO_ADMIN_PASSWORD only if you intentionally run with app.dev-mode=true
# (not recommended once a real school's data is in this database).

# NO managed database is declared here on purpose.
#
# Production runs on Neon (ap-southeast-1), not on a Render database. The
# original Render Postgres was on the free plan, expired, was deactivated, and
# crash-looped the backend with UnknownHostException on DB_HOST -- the data was
# migrated to Neon after that.
#
# A leftover Render 'acadia-postgres' instance may still exist in the workspace.
# It is NOT production. Do not re-add a databases: block pointing at it: the
# DB_* variables below would then resolve from it on the next blueprint sync and
# silently repoint the running application at an empty database. The app would
# boot cleanly, Flyway would baseline the empty schema, and every school would
# appear to have lost all of its data.
#
# The Neon connection details live only in the dashboard (see sync: false below).

services:
  # NOTE: the live backend is 'acadia-backend-sg', created by hand in the
  # dashboard so it could be placed in Singapore -- Render cannot change a
  # service's region in place. This entry documents its configuration; it is not
  # the source of truth for it. Before re-syncing this blueprint, check that
  # doing so will adopt the existing service rather than create a second one.
  - type: web
    name: acadia-backend-sg
    # Singapore, not Oregon: the users are in India and the Neon database is in
    # ap-southeast-1. Running the app in Oregon put it on the wrong continent
    # from both, costing ~230ms to reach a user and ~170ms on every query.
    # Measured after the move: the database round trip fell to ~0ms and a plain
    # page render went from 0.30s to 0.09s.
    region: singapore
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Starter, not free: the free tier spins the instance down when idle and
    # the next request pays a 50-120s cold start (measured at 121s). This must
    # match the plan set in the dashboard -- if the blueprint is ever re-synced
    # with 'free' here, Render silently downgrades and the cold starts return.
    plan: starter
    # Real health check: /login returns 200 even when the database is
    # unreachable, so a dead DB looked healthy. /actuator/health reports DOWN
    # when the DB connection fails, so Render stops routing to a broken
    # instance instead of serving errors.
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: APP_DEV_MODE
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      # Error tracking. sync:false means Render prompts for the value in the
      # dashboard rather than storing it here. Leave it unset and the Sentry
      # SDK stays a no-op — the app runs exactly as before.
      - key: SENTRY_DSN
        sync: false
      # Neon connection details. sync:false means Render keeps whatever is set
      # in the dashboard and this file never overwrites it -- which is the whole
      # point: these used to resolve fromDatabase: acadia-postgres, so a
      # blueprint sync would have repointed production at the wrong database.
      # Set these in the dashboard, never here; DB_PASSWORD is a secret.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

  # Nightly logical backup of the Neon database to S3.
  #
  # IMPORTANT: this entry documents the job, and creating it requires a blueprint
  # sync -- which this file warns above is risky, because a sync can create a
  # second service rather than adopting the existing one. If that risk is not
  # worth taking, create the cron job by hand in the dashboard with exactly the
  # settings below; nothing here depends on it having come from the blueprint.
  - type: cron
    name: acadia-db-backup
    # Same region as the database and the backend. A backup crossing continents
    # pays the latency on every row.
    region: singapore
    runtime: docker
    dockerfilePath: ./backup/Dockerfile
    dockerContext: ./backup
    # 20:30 UTC = 02:00 IST, which is the quiet hour for Indian schools. Not on
    # the hour: every cron job in the world fires at :00, and a dump competing
    # with everyone else's for Neon's attention is slower for no reason.
    schedule: "30 20 * * *"
    envVars:
      # Every value is entered in the dashboard. sync:false keeps this file from
      # ever carrying a database URL or an AWS secret, and keeps a blueprint sync
      # from overwriting what is set there.
      #
      # BACKUP_DATABASE_URL should be a read-only Neon role, not the application
      # user -- the SQL to create one is in the PR description. Keep
      # sslmode=require in it; Neon refuses plaintext, so losing it turns this
      # into a connection error rather than an insecure backup.
      - key: BACKUP_DATABASE_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # These three are not secret, so they live here rather than being retyped.
      - key: BACKUP_BUCKET
        value: acadia-db-backups-947752017191
      - key: AWS_DEFAULT_REGION
        value: ap-southeast-1
      # The dump is refused if it holds data for fewer tables than this. Raise it
      # as the schema grows: its job is to catch a dump taken against an empty
      # database or by a role that cannot see the schema, which otherwise
      # succeeds, uploads, and is discovered during a restore.
      - key: MIN_TABLES
        value: "20"

  # Static web build of the Expo mobile app — lets parents/students/teachers
  # use it from any browser with zero install, no app-store review needed.
  # EXPO_PUBLIC_API_HOST below points it at the deployed backend above; if
  # the backend is ever recreated and gets a different onrender.com subdomain,
  # update this value to match -- the mobile web build bakes it in at build
  # time, so it also needs a redeploy, not just an edit here.
  - type: web
    name: acadia-mobile-web
    runtime: static
    rootDir: mobile-app
    buildCommand: npm install && npx expo export -p web
    staticPublishPath: ./dist
    envVars:
      - key: EXPO_PUBLIC_API_HOST
        value: https://acadia-backend-sg.onrender.com
