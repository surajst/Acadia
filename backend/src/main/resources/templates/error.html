<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${errorMessage} ?: 'Something went wrong'">Something went wrong &middot; ACADIA</title>
    <link rel="stylesheet" href="/css/tailwind.css">
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="icon" type="image/png" href="/images/acadia-logo.png">
    <link rel="shortcut icon" href="/favicon.ico">
</head>
<!-- Light, like the rest of the portal. This page kept a dark glass-card
     treatment from before the Slate mist migration, so the one screen a user
     sees when something has already gone wrong was also the one screen that
     looked like a different product. -->
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="card p-8 text-center w-full" style="max-width:28rem">
        <img src="/images/acadia-logo.png" alt="ACADIA" style="height:56px; display:block; margin:0 auto 20px;">

        <div class="ico ico--lg ico--warn mx-auto mb-4">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
        </div>

        <!-- The 404 handler sets errorMessage to "Page not found", which this
             page used to discard and report as a generic failure instead. -->
        <h1 class="page-title mb-2" style="font-size:22px"
            th:text="${errorMessage} ?: 'Something went wrong'">Something went wrong</h1>
        <p class="text-sm mb-6" style="color:var(--text-3)">
            Please go back and try again. If it keeps happening, tell your school administrator what you were doing.
        </p>

        <a href="/" class="btn btn-primary btn-sm">Return to dashboard</a>
    </div>

</body>
</html>
