<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" style="height:100vh; height:100dvh; overflow:hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photos &middot; ACADIA</title>
    <link rel="stylesheet" href="/css/tailwind.css">
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="icon" type="image/png" href="/images/acadia-logo.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <style>
        .photo-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; }
        .album-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:12px; }
        .tile { background:#fff; border:1px solid var(--line, #e2e8f0); border-radius:14px; overflow:hidden; }
        .tile img { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:#eef2f7; }
        .tile-cover-empty { width:100%; aspect-ratio:4/3; display:flex; align-items:center; justify-content:center;
                            background:#eef2f7; color:#94a3b8; font-size:24px; }
        .lightbox { position:fixed; inset:0; background:rgba(15,23,42,.88); display:none;
                    align-items:center; justify-content:center; z-index:60; padding:16px; }
        .lightbox.open { display:flex; }
        .lightbox img { max-width:100%; max-height:100%; border-radius:10px; }
        .dialog { position:fixed; inset:0; background:rgba(15,23,42,.45); display:none;
                  align-items:center; justify-content:center; z-index:50; padding:16px; }
        .dialog.open { display:flex; }
        .badge-withheld { background:#fef3c7; color:#92400e; font-size:10px; font-weight:700;
                          padding:2px 6px; border-radius:999px; }
    </style>
</head>
<!-- Signed-in portal page: the page fills the screen and only the main area
     scrolls. 100vh first, 100dvh second, per the viewport rule. -->
<body style="height:100vh; height:100dvh; overflow:hidden; display:flex; flex-direction:column"
      class="bg-[#F4F6FB] text-[#0F172A] font-sans">
<input type="hidden" id="csrfToken" name="_csrf" th:if="${_csrf}" th:value="${_csrf.token}" />

<header class="bg-[#F4F6FB] border-b border-slate-200/50 shrink-0 z-40" style="height: 64px;">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-full flex items-center justify-between gap-3">
        <div style="display:flex; align-items:center; gap:10px;">
            <img src="/images/acadia-logo.png" alt="ACADIA" style="height:32px;">
            <span class="hidden sm:inline" style="font-size:16px; font-weight:600; color:#0F172A; letter-spacing:2px;">ACADIA</span>
        </div>
        <div style="min-width:0;">
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">Photos</h1>
            <p class="text-slate-500 mt-0.5 text-xs font-medium hidden sm:block">Albums from school, for the people in them.</p>
        </div>
        <a th:href="${shell != null} ? ${shell.home()} : '/login'"
           class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold bg-white/80 text-slate-600 hover:bg-slate-100 border border-slate-200/50">
            &larr; <span class="hidden sm:inline">Back</span>
        </a>
    </div>
</header>

<div id="gallery-scroll" style="flex:1; overflow-y:auto; min-height:0; width:100%;">
    <main id="gallery" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6" style="display:grid; gap:16px;"
          th:data-staff="${galleryStaff}">

        <!-- Shown only when the server has no photo storage set up. -->
        <div id="unavailable" class="card" style="display:none; padding:16px; border-left:4px solid #f59e0b;">
            <p class="text-sm font-semibold text-slate-800" id="unavailable-text"></p>
        </div>

        <p id="page-error" role="alert" class="text-sm text-red-600" style="display:none;"></p>

        <!-- ── Albums ─────────────────────────────────────────────────────── -->
        <section id="albums-view" style="display:grid; gap:16px;">

            <section id="new-album" class="card" th:if="${galleryStaff}" style="display:none;">
                <form id="newAlbumForm" onsubmit="event.preventDefault()" class="p-4" style="display:grid; gap:12px;">
                    <h2 class="card-title">New album</h2>
                    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px;">
                        <div class="space-y-1">
                            <label for="albumTitle" class="text-xs font-bold uppercase tracking-wider text-slate-500">Title</label>
                            <input id="albumTitle" type="text" maxlength="255" required placeholder="Sports Day 2026"
                                   class="w-full px-4 py-2 bg-[#F4F6FB]/60 border border-slate-200/50 rounded-xl text-slate-800 outline-none">
                        </div>
                        <div class="space-y-1">
                            <label for="albumAudience" class="text-xs font-bold uppercase tracking-wider text-slate-500">Who is it for</label>
                            <select id="albumAudience" required
                                    class="w-full px-4 py-2 bg-[#F4F6FB]/60 border border-slate-200/50 rounded-xl text-slate-800 outline-none">
                                <option value="">Loading&hellip;</option>
                            </select>
                        </div>
                    </div>
                    <div id="consent-missing" class="text-xs text-amber-800 bg-amber-50 rounded-xl px-3 py-2" style="display:none;"></div>
                    <label class="flex items-start gap-2 text-sm text-slate-700">
                        <input id="consentConfirmed" type="checkbox" class="mt-1">
                        <span>I have checked that every child who will appear in these photos has photo consent.</span>
                    </label>
                    <div style="display:flex; align-items:center; gap:12px;">
                        <button id="createAlbumBtn" type="submit" class="btn btn-primary">Create album</button>
                        <p id="new-album-error" role="alert" class="text-sm text-red-600"></p>
                    </div>
                </form>
            </section>

            <section class="card overflow-hidden">
                <div style="padding:12px 16px; border-bottom:1px solid var(--line);">
                    <h2 class="card-title">Albums</h2>
                </div>
                <div id="albums" class="p-4">
                    <p class="text-sm text-slate-500">Loading albums&hellip;</p>
                </div>
            </section>
        </section>

        <!-- ── One album ──────────────────────────────────────────────────── -->
        <section id="album-view" style="display:none; gap:16px;">
            <section class="card">
                <div class="p-4" style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
                    <div style="min-width:0;">
                        <button id="backToAlbums" type="button" class="text-xs font-semibold text-slate-500 hover:text-slate-800">&larr; All albums</button>
                        <h2 id="album-title" class="text-lg font-bold text-slate-900"></h2>
                        <p id="album-audience" class="text-xs text-slate-500"></p>
                    </div>
                    <div id="album-manage" style="display:none; align-items:center; gap:8px; flex-wrap:wrap;">
                        <!-- Asking for JPEG or PNG is what makes an iPhone convert its own
                             format on the way out, instead of sending a file we cannot read. -->
                        <label class="btn btn-primary" style="cursor:pointer;">
                            Add photos
                            <input id="photoInput" type="file" accept="image/jpeg,image/png" multiple class="sr-only">
                        </label>
                        <button id="removeAlbumBtn" type="button" class="btn btn-secondary">Remove album</button>
                    </div>
                </div>
                <p id="upload-progress" role="status" class="px-4 pb-3 text-sm text-slate-600" style="display:none;"></p>
                <p id="album-error" role="alert" class="px-4 pb-3 text-sm text-red-600" style="display:none;"></p>
            </section>
            <section class="card p-4">
                <div id="photos" class="photo-grid"></div>
            </section>
        </section>
    </main>
</div>

<!-- Full-size view. -->
<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photo">
    <img id="lightbox-img" alt="">
</div>

<!-- Who is in this photo (staff). -->
<div id="tag-dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="tag-title">
    <div class="card p-4" style="width:100%; max-width:420px; display:grid; gap:12px;">
        <h2 id="tag-title" class="card-title">Who is in this photo?</h2>
        <p class="text-xs text-slate-500">Only children with photo consent are listed.</p>
        <div id="tag-list" style="display:grid; gap:6px; max-height:280px; overflow-y:auto;"></div>
        <p id="tag-error" role="alert" class="text-sm text-red-600"></p>
        <div style="display:flex; justify-content:flex-end; gap:8px;">
            <button id="tagCancel" type="button" class="btn btn-secondary">Cancel</button>
            <button id="tagSave" type="button" class="btn btn-primary">Save</button>
        </div>
    </div>
</div>

<script>
(function () {
    var main = document.getElementById('gallery');
    var isStaff = main.dataset.staff === 'true';
    var available = true;
    var current = null;      // the album open now
    var taggingPhoto = null; // the photo whose tag dialog is open

    function el(tag, attrs, text) {
        var node = document.createElement(tag);
        Object.keys(attrs || {}).forEach(function (k) { node.setAttribute(k, attrs[k]); });
        if (text !== undefined) node.textContent = text;
        return node;
    }

    async function call(method, path, body, contentType) {
        var init = { method: method, headers: {} };
        if (body !== undefined) {
            init.headers['Content-Type'] = contentType || 'application/json';
            init.body = contentType ? body : JSON.stringify(body);
        }
        var res = await fetch(path, init);
        var data = null;
        try { data = await res.json(); } catch (e) { /* empty body */ }
        if (!res.ok) {
            var message = (data && data.error) || `Something went wrong (${res.status}). Please try again.`;
            throw new Error(message);
        }
        return data;
    }

    function show(id, on, display) { document.getElementById(id).style.display = on ? (display || 'block') : 'none'; }
    function say(id, text) { var n = document.getElementById(id); n.textContent = text || ''; n.style.display = text ? 'block' : 'none'; }

    // ── Status ───────────────────────────────────────────────────────────
    async function loadStatus() {
        var status = await call('GET', '/api/gallery/status');
        available = status.available;
        if (!available) {
            document.getElementById('unavailable-text').textContent = status.message;
            show('unavailable', true);
        }
    }

    // ── Albums ───────────────────────────────────────────────────────────
    async function loadAlbums() {
        var box = document.getElementById('albums');
        var albums;
        try {
            albums = await call('GET', '/api/gallery/albums');
        } catch (e) {
            box.replaceChildren(el('p', { class: 'text-sm text-red-600' }, e.message));
            return;
        }
        if (albums.length === 0) {
            var empty = el('div', { class: 'py-4 px-6 text-center', style: 'max-height:100px;' });
            empty.appendChild(el('p', { class: 'text-sm font-semibold text-slate-700' }, 'No albums yet'));
            empty.appendChild(el('p', { class: 'text-xs text-slate-500' },
                isStaff ? 'Create one above to start sharing photos.' : 'Photos your school shares with you will appear here.'));
            box.replaceChildren(empty);
            return;
        }
        var grid = el('div', { class: 'album-grid' });
        albums.forEach(function (album) {
            var card = el('button', { type: 'button', class: 'tile album-card', 'data-album-id': album.id, style: 'text-align:left;' });
            if (album.coverUrl) {
                card.appendChild(el('img', { src: album.coverUrl, alt: '', loading: 'lazy' }));
            } else {
                card.appendChild(el('div', { class: 'tile-cover-empty', 'aria-hidden': 'true' }, '\u{1F4F7}'));
            }
            var text = el('div', { style: 'padding:10px 12px;' });
            text.appendChild(el('p', { class: 'text-sm font-semibold text-slate-900' }, album.title));
            var count = album.photoCount === 1 ? '1 photo' : `${album.photoCount} photos`;
            text.appendChild(el('p', { class: 'text-xs text-slate-500' }, `${album.audienceLabel} · ${count}`));
            card.appendChild(text);
            card.addEventListener('click', function () { openAlbum(album); });
            grid.appendChild(card);
        });
        box.replaceChildren(grid);
    }

    // ── New album (staff) ────────────────────────────────────────────────
    async function loadAudiences() {
        var select = document.getElementById('albumAudience');
        var options = await call('GET', '/api/gallery/audiences');
        select.replaceChildren(el('option', { value: '' }, options.length ? 'Choose…' : 'You have no classes yet'));
        options.forEach(function (o, i) {
            var opt = el('option', { value: String(i) }, o.label);
            opt.dataset.type = o.type;
            opt.dataset.ref = o.ref || '';
            select.appendChild(opt);
        });
        select.addEventListener('change', checkConsent);
        show('new-album', available);
    }

    function chosenAudience() {
        var select = document.getElementById('albumAudience');
        var opt = select.options[select.selectedIndex];
        if (!opt || opt.value === '') return null;
        return { type: opt.dataset.type, ref: opt.dataset.ref || null };
    }

    async function checkConsent() {
        var audience = chosenAudience();
        var box = document.getElementById('consent-missing');
        box.style.display = 'none';
        if (!audience) return;
        var q = `audienceType=${encodeURIComponent(audience.type)}` + (audience.ref ? `&audienceRef=${encodeURIComponent(audience.ref)}` : '');
        try {
            var missing = await call('GET', `/api/gallery/consent-check?${q}`);
            if (missing.length) {
                var names = missing.slice(0, 8).map(function (p) { return `${p.name} (${p.sectionLabel})`; }).join(', ');
                var more = missing.length > 8 ? ` and ${missing.length - 8} more` : '';
                box.textContent = `No photo consent on record for: ${names}${more}. Leave them out of these photos.`;
                box.style.display = 'block';
            }
        } catch (e) { /* the create call reports anything that matters */ }
    }

    async function createAlbum() {
        var btn = document.getElementById('createAlbumBtn');
        var audience = chosenAudience();
        say('new-album-error', '');
        if (!audience) { say('new-album-error', 'Choose who the album is for.'); return; }
        btn.disabled = true;
        try {
            var album = await call('POST', '/api/gallery/albums', {
                title: document.getElementById('albumTitle').value,
                audienceType: audience.type,
                audienceRef: audience.ref,
                consentConfirmed: document.getElementById('consentConfirmed').checked
            });
            document.getElementById('newAlbumForm').reset();
            document.getElementById('consent-missing').style.display = 'none';
            await loadAlbums();
            openAlbum(album);
        } catch (e) {
            say('new-album-error', e.message);
        } finally {
            btn.disabled = false;
        }
    }

    // ── One album ────────────────────────────────────────────────────────
    async function openAlbum(album) {
        current = album;
        show('albums-view', false);
        show('album-view', true, 'grid');
        document.getElementById('album-title').textContent = album.title;
        document.getElementById('album-audience').textContent = album.audienceLabel;
        show('album-manage', isStaff && album.canAddPhotos && available, 'flex');
        say('album-error', '');
        await loadPhotos();
    }

    async function loadPhotos() {
        var box = document.getElementById('photos');
        var photos;
        try {
            photos = await call('GET', `/api/gallery/albums/${current.id}/photos`);
        } catch (e) {
            say('album-error', e.message);
            return;
        }
        if (photos.length === 0) {
            var empty = el('div', { class: 'py-4 px-6 text-center', style: 'grid-column:1/-1; max-height:100px;' });
            empty.appendChild(el('p', { class: 'text-sm font-semibold text-slate-700' }, 'No photos in this album yet'));
            empty.appendChild(el('p', { class: 'text-xs text-slate-500' },
                current.canAddPhotos ? 'Use “Add photos” to upload some.' : 'Check back after the event.'));
            box.replaceChildren(empty);
            return;
        }
        box.replaceChildren();
        photos.forEach(function (photo) {
            var tile = el('div', { class: 'tile photo-tile', 'data-photo-id': photo.id });
            var open = el('button', { type: 'button', class: 'photo-open', 'aria-label': 'Open photo', style: 'display:block; width:100%;' });
            open.appendChild(el('img', { src: photo.thumbUrl, alt: 'Photo', loading: 'lazy' }));
            open.addEventListener('click', function () { openLightbox(photo.displayUrl); });
            tile.appendChild(open);
            if (isStaff) {
                var meta = el('div', { style: 'padding:8px; display:grid; gap:6px;' });
                if (photo.withheldForConsent) {
                    meta.appendChild(el('span', { class: 'badge-withheld' }, 'Hidden from families: a child in it has no consent'));
                }
                if (photo.taggedNames && photo.taggedNames.length) {
                    meta.appendChild(el('p', { class: 'text-[11px] text-slate-500' }, photo.taggedNames.join(', ')));
                }
                if (current.canAddPhotos) {
                    var actions = el('div', { style: 'display:flex; gap:6px;' });
                    var tag = el('button', { type: 'button', class: 'btn btn-secondary photo-tag', style: 'padding:2px 8px; font-size:12px;' }, 'Who is in it');
                    tag.addEventListener('click', function () { openTagDialog(photo); });
                    var remove = el('button', { type: 'button', class: 'btn btn-secondary photo-remove', style: 'padding:2px 8px; font-size:12px;' }, 'Remove');
                    remove.addEventListener('click', function () { removePhoto(photo, remove); });
                    actions.appendChild(tag);
                    actions.appendChild(remove);
                    meta.appendChild(actions);
                }
                tile.appendChild(meta);
            }
            box.appendChild(tile);
        });
    }

    async function uploadFiles(files) {
        var progress = document.getElementById('upload-progress');
        var failures = [];
        say('album-error', '');
        for (var i = 0; i < files.length; i++) {
            progress.textContent = `Uploading ${i + 1} of ${files.length}…`;
            progress.style.display = 'block';
            try {
                await call('POST', `/api/gallery/albums/${current.id}/photos`, files[i], files[i].type || 'image/jpeg');
            } catch (e) {
                failures.push(`${files[i].name}: ${e.message}`);
            }
        }
        progress.style.display = 'none';
        if (failures.length) say('album-error', failures.join(' '));
        await loadPhotos();
    }

    async function removePhoto(photo, button) {
        if (!window.confirm('Remove this photo? It is deleted for everyone.')) return;
        button.disabled = true;
        try {
            await call('DELETE', `/api/gallery/photos/${photo.id}`);
            await loadPhotos();
        } catch (e) {
            button.disabled = false;
            say('album-error', e.message);
        }
    }

    async function removeAlbum() {
        if (!window.confirm('Remove this album and every photo in it? They are deleted for everyone.')) return;
        try {
            await call('DELETE', `/api/gallery/albums/${current.id}`);
            backToAlbums();
        } catch (e) {
            say('album-error', e.message);
        }
    }

    function backToAlbums() {
        current = null;
        show('album-view', false);
        show('albums-view', true, 'grid');
        loadAlbums();
    }

    // ── Lightbox and tagging ─────────────────────────────────────────────
    function openLightbox(url) {
        document.getElementById('lightbox-img').src = url;
        document.getElementById('lightbox').classList.add('open');
    }

    async function openTagDialog(photo) {
        taggingPhoto = photo;
        say('tag-error', '');
        var list = document.getElementById('tag-list');
        list.replaceChildren(el('p', { class: 'text-sm text-slate-500' }, 'Loading…'));
        document.getElementById('tag-dialog').classList.add('open');
        try {
            var pupils = await call('GET', `/api/gallery/albums/${current.id}/pupils`);
            list.replaceChildren();
            if (!pupils.length) {
                list.appendChild(el('p', { class: 'text-sm text-slate-500' }, 'No children in this album have photo consent on record.'));
            }
            pupils.forEach(function (p) {
                var row = el('label', { class: 'flex items-center gap-2 text-sm text-slate-700' });
                var box = el('input', { type: 'checkbox', class: 'tag-pupil' });
                box.dataset.studentId = p.id;
                box.checked = (photo.taggedNames || []).indexOf(p.name) >= 0;
                row.appendChild(box);
                row.appendChild(el('span', {}, `${p.name} · ${p.sectionLabel}`));
                list.appendChild(row);
            });
        } catch (e) {
            say('tag-error', e.message);
        }
    }

    async function saveTags() {
        var ids = Array.prototype.slice.call(document.querySelectorAll('.tag-pupil:checked'))
            .map(function (b) { return b.dataset.studentId; });
        try {
            await call('POST', `/api/gallery/photos/${taggingPhoto.id}/pupils`, { studentIds: ids });
            document.getElementById('tag-dialog').classList.remove('open');
            await loadPhotos();
        } catch (e) {
            say('tag-error', e.message);
        }
    }

    document.getElementById('lightbox').addEventListener('click', function () {
        this.classList.remove('open');
        document.getElementById('lightbox-img').removeAttribute('src');
    });
    document.getElementById('backToAlbums').addEventListener('click', backToAlbums);
    document.getElementById('tagCancel').addEventListener('click', function () {
        document.getElementById('tag-dialog').classList.remove('open');
    });
    document.getElementById('tagSave').addEventListener('click', saveTags);
    var removeAlbumBtn = document.getElementById('removeAlbumBtn');
    if (removeAlbumBtn) removeAlbumBtn.addEventListener('click', removeAlbum);
    var input = document.getElementById('photoInput');
    if (input) input.addEventListener('change', function () {
        var files = Array.prototype.slice.call(input.files);
        input.value = '';
        if (files.length) uploadFiles(files);
    });
    var form = document.getElementById('newAlbumForm');
    if (form) form.addEventListener('submit', createAlbum);

    (async function start() {
        try {
            await loadStatus();
        } catch (e) {
            say('page-error', e.message);
        }
        if (isStaff) {
            try { await loadAudiences(); } catch (e) { say('page-error', e.message); }
        }
        await loadAlbums();
    })();
})();
</script>
</body>
</html>
