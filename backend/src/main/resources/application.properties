spring.application.name=backend

# Render (and most PaaS hosts) inject the port to bind via $PORT.
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:file:./data/schoolosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Schema is owned by Flyway migrations (src/main/resources/db/migration/{vendor}),
# not Hibernate. ddl-auto=validate makes Hibernate verify the DB matches the
# entities at startup and fail fast on drift, instead of silently mutating it.
# spring.sql.init is off so the legacy schema.sql no longer runs.
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway — vendor-specific migrations ({vendor} = h2 | postgresql).
# baseline-on-migrate adopts an existing (pre-Flyway) database at V1 without
# re-running the baseline DDL; a fresh/empty database gets V1 applied normally.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=entity-derived baseline

# HikariCP connection pool configurations
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=%h %t "%r" %s %b %D ms
spring.mvc.log-resolved-exception=true

# Dev-mode flag — set to true only in local dev to enable seed endpoints
app.dev-mode=false

# JWT signing secret — set a real random value via the JWT_SECRET env var in
# any real deployment. This default is dev-only and must not be used in prod.
app.jwt-secret=${JWT_SECRET:dev-only-insecure-default-change-in-production-please-32bytes-min}

# Demo admin password used by AcademicDataSeeder (only runs when app.dev-mode=true)
demo.admin.password=${DEMO_ADMIN_PASSWORD:PilotLaunchSecure2026!}

# Azure Cognitive Services — Speech (STT/TTS) and Translator, for parent
# voice-to-text replies and announcement/message translation. Blank by
# default; features fail gracefully with a clear error until configured.
azure.speech.key=${AZURE_SPEECH_KEY:}
azure.speech.region=${AZURE_SPEECH_REGION:}
azure.translator.key=${AZURE_TRANSLATOR_KEY:${azure.speech.key}}
azure.translator.region=${AZURE_TRANSLATOR_REGION:${azure.speech.region}}
