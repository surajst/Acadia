spring.application.name=backend

# Render (and most PaaS hosts) inject the port to bind via $PORT.
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:file:./data/schoolosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Schema is owned by Flyway migrations (src/main/resources/db/migration/{vendor}),
# not Hibernate. ddl-auto=validate makes Hibernate verify the DB matches the
# entities at startup and fail fast on drift, instead of silently mutating it.
# spring.sql.init is off so the legacy schema.sql no longer runs.
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway — vendor-specific migrations ({vendor} = h2 | postgresql).
# baseline-on-migrate adopts an existing (pre-Flyway) database at V1 without
# re-running the baseline DDL; a fresh/empty database gets V1 applied normally.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=entity-derived baseline

# HikariCP connection pool configurations
spring.datasource.hikari.maximum-pool-size=20
# minimum-idle=0 lets the pool drain completely when nobody is using the app.
#
# This is deliberate and costs money if changed back. Neon bills compute by the
# hour and suspends the endpoint after 5 minutes of inactivity -- that suspension
# is where the savings come from. The web service runs on Render Starter, so it
# never sleeps; holding a floor of idle connections open around the clock can
# keep the database awake 24/7 and bill for roughly 180 CU-hrs/month instead of
# the ~20 actually needed for school hours.
#
# idle-timeout is set below Neon's 5-minute suspend window so the pool has
# already let go before the database tries to suspend.
#
# The trade-off: the first request after a quiet period pays to open a fresh
# connection and wake the endpoint. That lands on overnight and weekend traffic,
# not on a working school day, when the pool stays warm on its own.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000

# ─── Observability (Spring Boot Actuator + Micrometer) ──────────────────────
# Only health/info/metrics/prometheus are exposed; everything else (env,
# beans, heapdump, loggers, ...) stays off because those leak configuration
# and secrets. SecurityConfig makes /actuator/health public (Render's health
# check calls it unauthenticated) and locks the rest to ADMIN.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.base-path=/actuator

# Health: show component detail (db, diskSpace, ping) only to authorised
# callers, so the public probe response stays a bare {"status":"UP"} and
# reveals nothing about internals.
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
# Report DOWN when the database is unreachable. Render health-checked /login,
# which returns 200 even with the DB down, so a dead database looked healthy.
management.health.db.enabled=true

# Tag every metric with the app name so a shared Prometheus can separate them.
management.metrics.tags.application=${spring.application.name}
# p95/p99 HTTP latency. Deliberately percentiles (computed in-app, 2 extra
# series per URI) rather than percentiles-histogram (server-side buckets):
# histograms emitted ~70 bucket series per URI — measured at 2001 of 2152
# http_server_requests series and a 483 KB scrape — which is wasteful for a
# single-instance deployment. Switch to percentiles-histogram only if metrics
# ever need aggregating across several instances.
management.metrics.distribution.percentiles.http.server.requests=0.95,0.99

# Build/version info on /actuator/info — makes "what is actually deployed?"
# answerable during an incident.
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Concept school management backend

# ─── Error tracking (Sentry) ────────────────────────────────────────────────
# Blank DSN by default, which makes the SDK a no-op — nothing is sent from
# local runs, tests, or CI. Set SENTRY_DSN in the Render dashboard to turn it
# on for the deployment.
#
# send-default-pii stays false deliberately. This system holds children's
# records, so Sentry must not attach request bodies, cookies, headers, or the
# authenticated user's identity to an event. A stack trace plus the URL is
# enough to debug, and anything more would put student data in a third-party
# service. Do not flip this on without a deliberate privacy review.
sentry.dsn=${SENTRY_DSN:}
sentry.send-default-pii=false
sentry.environment=${SENTRY_ENVIRONMENT:production}
# Errors only. Performance tracing would sample every request and is not worth
# the quota or the overhead here.
sentry.traces-sample-rate=0.0
sentry.max-request-body-size=none

server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=%h %t "%r" %s %b %D ms
spring.mvc.log-resolved-exception=true

# Every log line carries the id of the request that produced it (see
# RequestIdFilter), which is also returned as the X-Request-Id response
# header. Given one id from a user report, the whole request can be pulled
# out of a log full of interleaved concurrent traffic.
logging.pattern.level=%5p [${spring.application.name:concept},%X{requestId:-no-request}]

# Dev-mode flag — set to true only in local dev to enable seed endpoints
app.dev-mode=false

# Per-IP throttling of the unauthenticated endpoints (see RateLimitFilter).
# Automatically off whenever app.dev-mode=true, so local runs and the CI e2e
# job are unaffected; these values only bite in a real deployment.
app.rate-limit.enabled=true
app.rate-limit.signup-per-hour=5
app.rate-limit.login-per-15min=20

# JWT signing secret — set a real random value via the JWT_SECRET env var in
# any real deployment. This default is dev-only and must not be used in prod.
app.jwt-secret=${JWT_SECRET:dev-only-insecure-default-change-in-production-please-32bytes-min}

# Demo admin password used by AcademicDataSeeder (only runs when app.dev-mode=true)
demo.admin.password=${DEMO_ADMIN_PASSWORD:PilotLaunchSecure2026!}

# Azure Cognitive Services — Speech (STT/TTS) and Translator, for parent
# voice-to-text replies and announcement/message translation. Blank by
# default; features fail gracefully with a clear error until configured.
azure.speech.key=${AZURE_SPEECH_KEY:}
azure.speech.region=${AZURE_SPEECH_REGION:}
azure.translator.key=${AZURE_TRANSLATOR_KEY:${azure.speech.key}}
azure.translator.region=${AZURE_TRANSLATOR_REGION:${azure.speech.region}}
